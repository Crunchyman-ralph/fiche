name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build

  test:
    name: Test + migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fiche
          POSTGRES_PASSWORD: fiche
          POSTGRES_DB: fiche
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiche"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fiche:fiche@localhost:5432/fiche
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Apply migrations to live Postgres
        run: bun run db:migrate
      - name: Run tests
        run: bun run test

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    env:
      # drizzle-kit needs the env var set even when generating; the URL
      # is not actually opened during `generate`.
      DATABASE_URL: postgres://placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Regenerate migration from schema
        run: bun run db:generate
      - name: Fail if uncommitted migration changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::packages/db/src/schema.ts has changed but no migration was committed."
            echo "::error::Run 'bun run db:generate' locally and commit the new files in packages/db/drizzle/."
            git status --short
            git --no-pager diff -- packages/db/drizzle
            exit 1
          fi
