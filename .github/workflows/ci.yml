name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Bun version is read from .bun-version by setup-bun (auto-detect via
# bun-version-file). Actions pinned to SHAs to make supply-chain pinning
# explicit; @v4 tags are mutable and could be replaced upstream.

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build

  test:
    name: Test + migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fiche
          POSTGRES_PASSWORD: fiche
          POSTGRES_DB: fiche
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiche -d fiche"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fiche:fiche@localhost:5432/fiche
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Apply committed migrations to live Postgres
        run: bun run db:migrate
      - name: Run tests
        run: bun run test

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    env:
      # drizzle-kit needs the env var set even when generating; the URL
      # is not actually opened during `generate`.
      DATABASE_URL: postgres://placeholder
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Regenerate migration from schema
        run: bun run db:generate
      - name: Fail if uncommitted migration changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::packages/db/src/schema.ts has changed but no migration was committed."
            echo "::error::Run 'bun run db:generate' locally and commit the new files in packages/db/drizzle/."
            git status --short
            git --no-pager diff -- packages/db/drizzle
            exit 1
          fi
